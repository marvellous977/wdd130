<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Rapics</title>
    <meta name="description"
      content="Contact Rapics for whitewater rafting adventures on Deer Creek River.
      Find our location, phone number, email address, and information for rafting questions and reservations.">
    <meta name="author" content="Onoja Marvellous">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-rapics.jpg" alt="Company Logo" width="200">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <section class="contact-info">
            <h1>Rapics</h1>
            <p>36 Adventure Creek Road</p>
            <p>Kolob,California</p>
            <p>+234 8166458110</p>
            <p>amaazingrapics@gmail.com</p>

            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3132.6198386037195!2d-122.07703902491222!3d38.26512217186593!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808516af083847c1%3A0xe40c43fb5f1dea2f!2sKolob%20Way%2C%20Fairfield%2C%20CA%2094534%2C%20USA!5e0!3m2!1sen!2sng!4v1786199336041!5m2!1sen!2sng"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </section>

        <form class="contact-form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">

            <fieldset>
                <legend>Message Purpose</legend>

                <label for="general">
                    <input type="radio" id="general" name="purpose" value="general">
                    General Inquiry
                </label>

                <label for="reservation">
                    <input type="radio" id="reservation" name="purpose" value="reservation">
                    Reservation Question
                </label>

                <label for="suggestion">
                    <input type="radio" id="suggestion" name="purpose" value="suggestion">
                    Website Suggestion
                </label>
            </fieldset>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5"></textarea>

            <label for="subscribe">
                <input type="checkbox" id="subscribe" name="subscribe">
                Please subscribe me to the monthly newsletter
            </label>

            <button type="submit">Get in Touch!</button>
        </form>

        <section class="employees">
            <h2>We are here to Serve You</h2>

            <figure>
                <img src="images/james-anderson.webp" alt="James Anderson, Head Rafting Guide">
                <figcaption>James Anderson - Head Rafting Guide</figcaption>
            </figure>

            <figure>
                <img src="images/sarah-mitchell.webp" alt="Sarah Mitchell, Custom Service Manager">
                <figcaption>Sarah Mitchell - Custom Service Manager</figcaption>
            </figure>

            <figure>
                <img src="images/michael-thompson.webp" alt="Michael Thompson, Safety Coordinator">
                <figcaption>Michael Thompson - Safety Coordinator</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 | Rapics | Onoja Marvellous</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.png"
                  alt="Follow us on Facebook"></a>
            <a href="https://instagram.com"><img src="images/instagram.png"
                  alt="Follow us on instagram"></a>
            <a href="https://whatsapp.com"><img src="images/whatsapp.png"
                  alt="Follow us on whatsapp"></a>
        </nav>
    </footer>

</body>

</html>
